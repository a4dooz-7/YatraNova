<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YatraNova | Feedback</title>
    <link rel="icon" href="img/logo.png" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap");

      body {
        margin: 0;
        background: url(https://images.unsplash.com/photo-1619441207978-3d326c46e2c9?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D)
          center/cover no-repeat fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .feedback-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 60px;
        border-radius: 30px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      }

      h2 {
        color: #111;
        margin: 0 0 15px 0;
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.2;
      }

      p {
        color: #333; /* Darkened slightly for better readability on blur */
        font-size: 1rem;
        margin-bottom: 40px;
        line-height: 1.6;
      }

      input,
      textarea {
        width: 100%;
        padding: 18px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        font-size: 1rem;
        font-family: inherit;
        box-sizing: border-box;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #2ecc71;
        background: #fff;
        transform: translateY(-2px);
      }

      button {
        width: 100%;
        padding: 18px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition:
          background 0.3s ease,
          transform 0.2s;
      }

      button:hover {
        background-color: #27ae60;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="feedback-card">
      <h2>Make us better.</h2>
      <p>
        We’re constantly evolving. Tell us what you love or where we’re falling
        short.
      </p>

      <form
        action="mailto:your-email@example.com"
        method="dialog"
        enctype="text/plain"
      >
        <input
          type="text"
          name="name"
          placeholder="Your name (optional)"
          required
        />
        <textarea
          name="feedback"
          rows="4"
          placeholder="Be honest—what should we improve?"
          required
        ></textarea>
        <button type="submit">Send Feedback</button>
      </form>
    </div>
  </body>
</html>
